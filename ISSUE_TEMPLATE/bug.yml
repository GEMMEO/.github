name: 🐞 Bug
description: Signaler un dysfonctionnement
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: service
    attributes:
      label: Service concerné
      options:
        - GEMMSA
        - GEMMANAGER
        - GEMCALC
        - GEMENTREPRISES
        - GEMCLIENT
        - GEMDOCS
        - GEMLEARNING
        - Infra / CI
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Étapes pour reproduire
      value: |
        1.
        2.
        3.
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
  - type: textarea
    id: actual
    attributes:
      label: Résultat obtenu
  - type: input
    id: version
    attributes:
      label: Version / environnement
      placeholder: "ex. preprod Docker, API v2, millésime 2026"
  - type: dropdown
    id: priority
    attributes:
      label: Priorité
      options:
        - P0-critique
        - P1-haute
        - P2-normale
        - P3-basse
    validations:
      required: true
